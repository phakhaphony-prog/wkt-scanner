<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="50%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
    <linearGradient id="laser" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(16,185,129,0)" />
      <stop offset="25%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#34d399" />
      <stop offset="75%" stop-color="#10b981" />
      <stop offset="100%" stop-color="rgba(16,185,129,0)" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with rounded corners (iOS App Icon Shape) -->
  <rect width="512" height="512" rx="115" fill="url(#bg)" />
  <rect width="504" height="504" x="4" y="4" rx="111" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4" />

  <!-- Barcode Vertical Lines -->
  <g fill="#ffffff" opacity="0.88">
    <rect x="130" y="160" width="10" height="192" rx="4" />
    <rect x="154" y="160" width="18" height="192" rx="5" />
    <rect x="186" y="160" width="8"  height="192" rx="4" />
    <rect x="208" y="160" width="24" height="192" rx="6" />
    <rect x="246" y="160" width="12" height="192" rx="4" />
    <rect x="272" y="160" width="16" height="192" rx="5" />
    <rect x="302" y="160" width="8"  height="192" rx="4" />
    <rect x="324" y="160" width="22" height="192" rx="6" />
    <rect x="360" y="160" width="12" height="192" rx="4" />
  </g>

  <!-- Scanning Reticle Corners -->
  <g stroke="#3b82f6" stroke-width="8" stroke-linecap="round" fill="none" filter="url(#glow)">
    <!-- Top-Left -->
    <path d="M 96 150 L 96 112 A 16 16 0 0 1 112 96 L 150 96" />
    <!-- Top-Right -->
    <path d="M 362 96 L 400 96 A 16 16 0 0 1 416 112 L 416 150" />
    <!-- Bottom-Left -->
    <path d="M 96 362 L 96 400 A 16 16 0 0 0 112 416 L 150 416" />
    <!-- Bottom-Right -->
    <path d="M 362 416 L 400 416 A 16 16 0 0 0 416 400 L 416 362" />
  </g>

  <!-- Emerald Laser Line -->
  <rect x="76" y="250" width="360" height="8" rx="4" fill="url(#laser)" filter="url(#glow)" />
  <ellipse cx="256" cy="254" rx="140" ry="2" fill="#a7f3d0" />

  <!-- App Badge Text: WKT -->
  <g transform="translate(256, 436)" text-anchor="middle">
    <rect x="-65" y="-32" width="130" height="28" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text y="-14" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="14" font-weight="800" letter-spacing="3">WKT SCAN</text>
  </g>
</svg>
